# Low-latency profile for an MSI GF75 (GTX 1650 + Intel UHD 630, 120 Hz panel)
# with a GameCube adapter (Input Integrity / Lossless).
#
# Only the keys listed here are changed; every other line in port-settings.ini is kept.
# Apply with laptop\apply_profile.ps1. Values were checked against port/runtime/gx/pc_settings.cpp.

# --- Display ------------------------------------------------------------------------------
# Exclusive fullscreen removes the desktop compositor from the path. Falls back to borderless
# on its own if Windows refuses it (for example when the Steam overlay is loaded).
fullscreen 1
exclusivefullscreen 1
# Keep the cap at the panel rate. The game warns that a cap which does not divide the refresh
# (117 on a 120 Hz screen) shows frames for uneven times, which reads as choppy.
fps 120
# V-Sync stays on: sub-frame animation at 120 Hz tears badly without it, and Reflex below
# removes the queue that V-Sync would otherwise build.
vsync 1

# --- Latency ------------------------------------------------------------------------------
# NVIDIA Reflex: 0 off, 1 On, 2 On + Boost. The GTX 1650 supports Reflex (not DLSS).
# Boost keeps GPU clocks up, which matters here because this machine is CPU-bound and the
# laptop GPU otherwise downclocks between the short bursts of work.
reflex 2
reflexstats 1
# Early inputs online (default on). Offline added delay stays off.
early_inputs 1
offline_delay 0

# --- Image quality (the GPU sits at 1-2 ms of an 8.3 ms frame, so these are close to free) --
scale 3
ssaa 1
anisotropy 16
subframe 1
# DLSS, frame generation, ray reconstruction and path tracing cannot run on a GTX 1650.
dlss 0
framegen 0
pathtracing 0
rayreconstruction 0

# --- Audio --------------------------------------------------------------------------------
# 0 Auto, 1 Low latency (Windows shared, fixed buffer), 2 WASAPI exclusive, 3 ASIO.
# Auto measured a 120 ms queue from game to engine on this laptop. Raise the buffer to 30
# if you hear crackling.
audio_mode 1
audio_buffer_ms 20
# Starts new sound effects up to one sound frame (5 ms) sooner. Offline only; online and
# replays always use console timing.
audio_early_keyon 1
